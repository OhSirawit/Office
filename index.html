<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบบันทึกค่าใช้จ่ายออฟฟิศ (Web App)</title>

  <meta name="theme-color" content="#263547">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="เบิกจ่ายออฟฟิศ">
  <link id="appAppleIcon" rel="apple-touch-icon" href="">
  <link id="appFavicon" rel="icon" type="image/png" href="">
  <link id="appManifest" rel="manifest" href="">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    :root {
      --washi-bg: #F9F6F0;
      --sumi-ink: #2B2B2B;
      --hinoki-border: #E5DEC9;
      --akane-red: #C84B31;
      --matcha-green: #5F7A61;
      --ai-indigo: #263547;
    }
    body {
      font-family: 'Noto Sans Thai', sans-serif;
      background-color: var(--washi-bg);
      background-image: 
        radial-gradient(circle at 100% 100%, rgba(200, 75, 49, 0.03) 0, transparent 40%),
        radial-gradient(circle at 0% 0%, rgba(95, 122, 97, 0.05) 0, transparent 40%),
        radial-gradient(#dcd3be 0.6px, transparent 0.6px);
      background-size: 100% 100%, 100% 100%, 24px 24px;
      color: var(--sumi-ink);
      -webkit-tap-highlight-color: transparent;
    }
    .fade-in { animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    
    .shoji-card {
      background: rgba(255, 253, 249, 0.98);
      border: 1px solid var(--hinoki-border);
      box-shadow: 0 8px 24px -8px rgba(43, 43, 43, 0.06);
    }
    .washi-input {
      transition: all 0.2s ease;
      border: 1px solid #DCD5C4;
      background-color: #FFFFFF;
      color: #2B2B2B;
    }
    .washi-input:focus {
      border-color: var(--akane-red);
      box-shadow: 0 0 0 3px rgba(200, 75, 49, 0.12);
      outline: none;
    }
    .btn-indigo-jp {
      background-color: #263547;
      color: #F9F6F0;
      transition: all 0.25s ease;
      box-shadow: 0 6px 16px -4px rgba(38, 53, 71, 0.25);
    }
    .btn-indigo-jp:hover:not(:disabled) {
      background-color: #1B2634;
      transform: translateY(-1px);
      box-shadow: 0 10px 20px -4px rgba(38, 53, 71, 0.35);
    }
    .btn-indigo-jp:disabled { opacity: 0.7; cursor: not-allowed; }
    
    /* Bottom Navigation Safe Area */
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #F2ECE1; }
    ::-webkit-scrollbar-thumb { background: #C7BFA9; border-radius: 9999px; }
  </style>
</head>
<body class="min-h-screen pb-24 antialiased selection:bg-[#C84B31] selection:text-white">

  <div class="h-1.5 w-full bg-gradient-to-r from-[#263547] via-[#C84B31] to-[#5F7A61]"></div>

  <header class="bg-[#FFFDF9]/95 backdrop-blur-md sticky top-0 z-30 border-b border-[#E5DEC9]">
    <div class="max-w-2xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-xl bg-[#C84B31] text-[#FFFDF9] flex items-center justify-center shadow-sm border border-[#A63A22] shrink-0">
          <i class="fa-solid fa-file-invoice-dollar text-lg"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-lg font-bold tracking-tight text-[#2B2B2B]">เบิกจ่ายออฟฟิศ</h1>
            <span class="text-[9px] px-2 py-0.5 rounded font-bold border border-[#C84B31] text-[#C84B31] bg-[#C84B31]/5">WepApp</span>
          </div>
          <p class="text-[11px] text-[#6E6A63] flex items-center gap-1.5 mt-0.5">
            <span id="syncDot" class="w-1.5 h-1.5 rounded-full bg-[#5F7A61] animate-pulse"></span>
            <span id="syncText">เชื่อมต่อฐานข้อมูลแล้ว</span>
          </p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button type="button" id="installAppBtn" onclick="handleInstallClick()" class="bg-[#C84B31]/10 text-[#C84B31] hover:bg-[#C84B31] hover:text-white text-[11px] px-3 py-2 rounded-lg font-bold transition flex items-center gap-1.5 border border-[#C84B31]/20">
          <i class="fa-solid fa-mobile-screen-button"></i> <span>ติดตั้งแอป</span>
        </button>
        <button type="button" onclick="fetchFromSheet()" class="bg-[#F4EFE6] hover:bg-[#EAE2D3] text-[#3D3A35] border border-[#DCD3C0] text-[11px] px-3 py-2 rounded-lg font-medium transition flex items-center gap-1.5">
          <i class="fa-solid fa-rotate text-[#C84B31]" id="refreshIcon"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 mt-6">
    
    <!-- ==================== VIEW 1: ฟอร์มบันทึก (FORM VIEW) ==================== -->
    <section id="view-form" class="fade-in block space-y-5">
      <form id="expenseForm" onsubmit="handleSubmit(event)" class="shoji-card rounded-2xl overflow-hidden">
        <div class="bg-[#F2ECE1]/80 px-5 py-3.5 border-b border-[#E2D9C5] flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <span class="w-1.5 h-4 rounded-sm bg-[#C84B31]"></span>
            <h2 class="font-bold text-[#2B2B2B] text-sm">บันทึกรายการใหม่</h2>
          </div>
          <span class="text-[10px] text-[#C84B31] font-semibold">* จำเป็น</span>
        </div>

        <div class="p-5 space-y-5">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-[#5A554C] mb-1.5">วันที่ทำรายการ <span class="text-[#C84B31]">*</span></label>
              <input type="date" id="date" required class="washi-input w-full rounded-xl px-3 py-2.5 text-sm font-medium">
            </div>
            <div>
              <label for="category" class="block text-xs font-bold text-[#5A554C] mb-1.5">หมวดหมู่ <span class="text-[#C84B31]">*</span></label>
              <div class="relative">
                <select id="category" required onchange="selectCategory(this.value)" class="washi-input w-full appearance-none rounded-xl px-3 py-2.5 pr-8 text-sm font-semibold cursor-pointer">
                  <option value="วิ่งงานรถ">🚚 วิ่งงานรถ</option>
                  <option value="เบิกเงิน">💴 เบิกเงิน</option>
                  <option value="เชื้อเพลิง">⛽ เชื้อเพลิง</option>
                  <option value="ล้างรถ">🫧 ล้างรถ</option>
                  <option value="ซ่อมรถ">🔧 ซ่อมบำรุงรถ</option>
                  <option value="คืนเงิน">🍵 คืนเงินสด</option>
                  <option value="ฝากซื้อของ">🛍️ ฝากซื้อของ</option>
                  <option value="อื่นๆ">🎐 อื่นๆ</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-[#7A746B]"><i class="fa-solid fa-chevron-down text-[10px]"></i></div>
              </div>
            </div>
          </div>

          <div id="dynamicSection" class="fade-in bg-[#F6F2E9] p-4 rounded-xl border border-[#E2D9C5] space-y-3.5">
            <!-- (ถูกแทนที่ด้วย JS ตามหมวดหมู่) -->
          </div>

          <div>
            <label class="block text-xs font-bold text-[#5A554C] mb-1.5">รายละเอียดเพิ่มเติม <span class="text-[#C84B31]">*</span></label>
            <textarea id="details" rows="2" required placeholder="ระบุรายละเอียดงาน / จุดหมายปลายทาง..." class="washi-input w-full rounded-xl px-3.5 py-2.5 text-sm"></textarea>
          </div>

          <!-- กล่องพิกัด GPS ซ่อนปุ่ม บังคับดึงออโต้ -->
          <div class="hidden">
             <input type="text" id="locationName">
             <input type="hidden" id="lat"><input type="hidden" id="lng">
          </div>

          <div class="pt-2">
            <div class="grid grid-cols-2 gap-3 mb-3">
              <button type="button" onclick="toggleReceiptDrawer()" class="flex items-center justify-center gap-2 py-3 px-2 rounded-xl border-2 border-dashed border-[#C7BFA9] bg-[#FFFDF9] hover:border-[#C84B31] hover:text-[#C84B31] text-[#263547] font-bold text-[11px] sm:text-xs transition shadow-sm">
                <i class="fa-solid fa-camera text-base"></i> <span>แนบใบเสร็จ</span>
              </button>

              <div class="flex items-center justify-center gap-2 py-3 px-2 rounded-xl border border-[#E2D9C5] bg-[#FFFDF9] text-[#2B2B2B] font-bold text-[11px] sm:text-xs shadow-sm select-none">
                <input type="checkbox" checked disabled class="w-4 h-4 rounded accent-[#263547]">
                <span class="tracking-wide">SAVE GPS</span>
                <span id="gpsMiniDot" class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse ml-1"></span>
              </div>
            </div>

            <!-- ลิ้นชักเลือกรูป -->
            <div id="receiptChoiceDrawer" class="hidden fade-in grid grid-cols-2 gap-2 bg-[#F6F2E9] p-2 rounded-xl border border-[#E2D9C5] mb-3">
              <button type="button" onclick="openCamera()" class="flex flex-col items-center justify-center gap-1.5 py-2.5 rounded-lg bg-white border border-[#DCD3C0] text-[#2B2B2B] font-semibold text-[11px]">
                <i class="fa-solid fa-camera text-[#C84B31] text-lg"></i> ถ่ายรูป
              </button>
              <label class="flex flex-col items-center justify-center gap-1.5 py-2.5 rounded-lg bg-white border border-[#DCD3C0] text-[#2B2B2B] font-semibold text-[11px] cursor-pointer">
                <i class="fa-solid fa-images text-[#5F7A61] text-lg"></i> อัลบั้ม
                <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
              </label>
            </div>

            <!-- กล้อง -->
            <div id="cameraBox" class="hidden bg-[#1E1E1E] rounded-xl overflow-hidden relative shadow-lg mb-3">
              <video id="cameraVideo" autoplay playsinline class="w-full max-h-64 object-cover"></video>
              <div class="p-3 bg-[#2B2B2B] flex items-center justify-between">
                <button type="button" onclick="switchCamera()" class="text-[#F9F6F0] text-[11px] bg-white/10 px-3 py-2 rounded-lg"><i class="fa-solid fa-camera-rotate"></i> สลับกล้อง</button>
                <button type="button" onclick="capturePhoto()" class="bg-[#C84B31] text-white font-bold text-[11px] px-4 py-2 rounded-full"><i class="fa-solid fa-circle"></i> ถ่ายภาพ</button>
                <button type="button" onclick="closeCamera()" class="text-[#C7BFA9] text-[11px] px-2 py-2">ยกเลิก</button>
              </div>
            </div>

            <div id="previewBox" class="hidden flex flex-col gap-2 bg-[#F9F6F0] border border-[#DCD3C0] p-3 rounded-xl mb-3">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <img id="previewImg" class="w-12 h-12 rounded-lg object-cover border border-[#C7BFA9] cursor-pointer" onclick="viewFullImage(this.src)">
                  <div>
                    <p class="text-[11px] font-bold text-[#2B2B2B]" id="previewName">receipt.jpg</p>
                    <p class="text-[10px] text-[#6E6A63] mt-0.5" id="previewSize">บีบอัดแล้ว</p>
                    <p class="text-[10px] text-[#C84B31] font-semibold mt-1 hidden items-center gap-1" id="ocrStatusText">
                      <i class="fa-solid fa-wand-magic-sparkles fa-spin"></i> <span>กำลังสแกนราคา...</span>
                    </p>
                  </div>
                </div>
                <button type="button" onclick="clearImage()" class="w-8 h-8 rounded-lg bg-white text-[#C84B31] border border-[#E5DEC9] flex items-center justify-center">
                  <i class="fa-solid fa-trash-can text-xs"></i>
                </button>
              </div>
            </div>
          </div>

          <button type="submit" id="submitBtn" class="btn-indigo-jp w-full font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 text-sm">
            <span>บันทึกข้อมูลเข้าสู่ระบบ</span> <i class="fa-solid fa-paper-plane text-[#E8C574]"></i>
          </button>
        </div>
      </form>
    </section>

    <!-- ==================== VIEW 2: หน้าประวัติ (HISTORY VIEW) ==================== -->
    <section id="view-history" class="fade-in hidden space-y-5">
      <!-- การ์ดสรุปยอดสีเข้มหรูหรา -->
      <div class="relative overflow-hidden rounded-2xl bg-[#263547] p-5 text-[#F9F6F0] shadow-md border border-[#1B2634]">
        <div class="flex items-center justify-between">
          <span class="text-xs text-[#C7BFA9] font-medium">รวมค่าใช้จ่ายสุทธิ</span>
          <span class="w-7 h-7 rounded-lg bg-white/10 flex items-center justify-center text-[#E8C574] text-xs"><i class="fa-solid fa-wallet"></i></span>
        </div>
        <p class="text-3xl font-bold mt-2 tracking-tight text-[#FFFDF9]" id="sumExpense">฿0.00</p>
        <p class="text-[10px] text-[#9AA6B5] mt-1">คำนวณจากรายการทั้งหมด</p>
      </div>

      <div class="relative overflow-hidden rounded-2xl shoji-card p-5 border-l-4 border-l-[#5F7A61]">
        <div class="flex items-center justify-between">
          <span class="text-xs text-[#5A554C] font-bold">เก็บเงินสด / คืนเงิน</span>
          <span class="w-7 h-7 rounded-lg bg-[#5F7A61]/15 flex items-center justify-center text-[#5F7A61] text-xs"><i class="fa-solid fa-coins"></i></span>
        </div>
        <p class="text-2xl font-bold text-[#4E6650] mt-2 tracking-tight" id="sumCashIn">฿0.00</p>
        <p class="text-[10px] text-[#8C857B] mt-1">ยอดเงินสดรับเข้าออฟฟิศ</p>
      </div>

      <div class="shoji-card rounded-2xl overflow-hidden">
        <div class="px-5 py-3.5 border-b border-[#E5DEC9] bg-[#F2ECE1]/70 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="w-1.5 h-4 rounded-sm bg-[#C84B31]"></span>
            <h3 class="font-bold text-sm text-[#2B2B2B]">ประวัติธุรกรรมล่าสุด</h3>
          </div>
          <span class="text-[10px] bg-white text-[#2B2B2B] px-2.5 py-1 rounded-full font-bold border border-[#DCD3C0]" id="recordCount">0 รายการ</span>
        </div>
        <div id="historyList" class="divide-y divide-[#EDE6D6] max-h-[60vh] overflow-y-auto pb-4">
          <p class="text-center text-[#8C857B] text-sm py-10">ยังไม่มีรายการบันทึก</p>
        </div>
        
        <div class="p-3 bg-[#F6F2E9] border-t border-[#E5DEC9]">
          <button type="button" onclick="exportCSV()" class="w-full bg-white hover:bg-[#F2ECE1] text-[#3D3A35] border border-[#DCD3C0] text-xs px-3 py-2.5 rounded-xl font-bold transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-file-csv text-[#5F7A61]"></i> ส่งออกรายงาน (CSV)
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- ==================== BOTTOM NAVIGATION BAR ==================== -->
  <nav class="fixed bottom-0 w-full bg-[#FFFDF9]/95 backdrop-blur-md border-t border-[#E5DEC9] z-40 pb-safe shadow-[0_-4px_16px_rgba(0,0,0,0.03)]">
    <div class="max-w-2xl mx-auto flex justify-between px-2 pt-1 pb-1">
      <button type="button" onclick="switchTab('form')" id="nav-tab-form" class="flex-1 flex flex-col items-center justify-center py-2 text-[#C84B31] font-bold transition">
        <div class="w-10 h-7 flex items-center justify-center rounded-full bg-[#C84B31]/10 mb-1 transition-colors" id="nav-bg-form">
          <i class="fa-solid fa-pen-to-square text-lg"></i>
        </div>
        <span class="text-[10px]">บันทึกข้อมูล</span>
      </button>
      
      <button type="button" onclick="switchTab('history')" id="nav-tab-history" class="flex-1 flex flex-col items-center justify-center py-2 text-[#9C9283] font-medium transition hover:text-[#5F7A61]">
        <div class="w-10 h-7 flex items-center justify-center rounded-full bg-transparent mb-1 transition-colors" id="nav-bg-history">
          <i class="fa-solid fa-clock-rotate-left text-lg"></i>
        </div>
        <span class="text-[10px]">ประวัติ & สรุปยอด</span>
      </button>
    </div>
  </nav>

  <div id="imgModal" onclick="this.classList.add('hidden')" class="fixed inset-0 bg-[#1E1E1E]/85 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <img id="modalImgSrc" class="max-w-full max-h-[90vh] rounded-xl shadow-2xl border border-[#E5DEC9]/30">
  </div>

  <div id="toastBox" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 transform -translate-y-20 opacity-0 transition-all duration-300 pointer-events-none w-[90%] max-w-sm">
    <div id="toastInner" class="bg-[#263547] text-[#F9F6F0] border border-[#E5DEC9]/30 px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 text-xs sm:text-sm font-medium">
      <i id="toastIcon" class="fa-solid fa-circle-check text-[#88B08B] text-base"></i>
      <span id="toastMessage">แจ้งเตือน</span>
    </div>
  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzS7z62Yt31PU_4cssZbTmMsEqXAP45c8XW5X8U2HBZvG4a10oKLKXOwjVbuM1shlxw/exec";

    let records = [];
    try { records = JSON.parse(localStorage.getItem('office_expenses_v1') || '[]'); } catch (e) { records = []; }

    let compressedBase64 = '', compressedFileName = '';
    let cameraStream = null, facingMode = 'environment';
    
    // โซนภาพสำหรับการทำ OCR
    let zoneProductDataUrl = '', zoneAmountDataUrl = '', zoneNoteDataUrl = '';

    window.addEventListener('DOMContentLoaded', function() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('date').value = today;
      initWebAppManifest();
      renderHistory();
      fetchFromSheet();
      selectCategory('วิ่งงานรถ');
      acquireMandatoryGPS(false);
    });

    function switchTab(tabId) {
      const vForm = document.getElementById('view-form');
      const vHist = document.getElementById('view-history');
      const tForm = document.getElementById('nav-tab-form');
      const tHist = document.getElementById('nav-tab-history');
      const bgForm = document.getElementById('nav-bg-form');
      const bgHist = document.getElementById('nav-bg-history');

      if (tabId === 'form') {
        vForm.classList.remove('hidden'); vHist.classList.add('hidden');
        tForm.className = "flex-1 flex flex-col items-center justify-center py-2 text-[#C84B31] font-bold transition";
        bgForm.className = "w-10 h-7 flex items-center justify-center rounded-full bg-[#C84B31]/10 mb-1 transition-colors";
        tHist.className = "flex-1 flex flex-col items-center justify-center py-2 text-[#9C9283] font-medium transition hover:text-[#5F7A61]";
        bgHist.className = "w-10 h-7 flex items-center justify-center rounded-full bg-transparent mb-1 transition-colors";
      } else {
        vHist.classList.remove('hidden'); vForm.classList.add('hidden');
        tHist.className = "flex-1 flex flex-col items-center justify-center py-2 text-[#5F7A61] font-bold transition";
        bgHist.className = "w-10 h-7 flex items-center justify-center rounded-full bg-[#5F7A61]/15 mb-1 transition-colors";
        tForm.className = "flex-1 flex flex-col items-center justify-center py-2 text-[#9C9283] font-medium transition hover:text-[#C84B31]";
        bgForm.className = "w-10 h-7 flex items-center justify-center rounded-full bg-transparent mb-1 transition-colors";
      }
    }

    function initWebAppManifest() {
      try {
        const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#263547'; ctx.fillRect(0, 0, 512, 512);
        ctx.fillStyle = '#C84B31'; ctx.beginPath(); ctx.arc(256, 256, 170, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#FFFDF9'; ctx.font = 'bold 180px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('฿', 256, 268);
        const iconUrl = canvas.toDataURL('image/png');
        document.getElementById('appAppleIcon').href = iconUrl;
        document.getElementById('appFavicon').href = iconUrl;
      } catch (e) {}
    }

    function showNotice(msg, isError) {
      const box = document.getElementById('toastBox');
      document.getElementById('toastMessage').textContent = msg;
      document.getElementById('toastIcon').className = isError 
        ? 'fa-solid fa-circle-exclamation text-[#E57373] text-base' 
        : 'fa-solid fa-circle-check text-[#88B08B] text-base';
      box.classList.remove('-translate-y-20', 'opacity-0');

    function acquireMandatoryGPS(forceFresh) {
      return new Promise(function(resolve, reject) {
        const dot = document.getElementById('gpsMiniDot');
        if (!navigator.geolocation) {
          if (dot) dot.className = 'w-1.5 h-1.5 rounded-full bg-rose-500 ml-1';
          return reject(new Error('GPS not supported'));
        }
        if (dot) dot.className = 'w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse ml-1';

        navigator.geolocation.getCurrentPosition(async function(pos) {
          const lat = pos.coords.latitude.toFixed(6), lng = pos.coords.longitude.toFixed(6);
          document.getElementById('lat').value = lat; document.getElementById('lng').value = lng;
          if (dot) { dot.className = 'w-1.5 h-1.5 rounded-full bg-[#5F7A61] ml-1'; dot.classList.remove('animate-pulse'); }
          
          const locInput = document.getElementById('locationName');
          if (!locInput.value || forceFresh) {
            try {
              const res = await fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lng + '&accept-language=th');
              const data = await res.json();
              if (data && data.display_name) locInput.value = data.display_name.split(',').slice(0, 3).join(', ');
            } catch (e) {}
          }
          resolve({ lat: lat, lng: lng });
        }, function(err) {
          if (dot) dot.className = 'w-1.5 h-1.5 rounded-full bg-rose-500 ml-1';
          reject(err);
        }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
      });
    }

    function cropRegionZoom(img, rx, ry, rw, rh, scale) {
      const sx = Math.round(img.width * rx), sy = Math.round(img.height * ry);
      const sw = Math.round(img.width * rw), sh = Math.round(img.height * rh);
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(sw * scale)); c.height = Math.max(1, Math.round(sh * scale));
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
      return c.toDataURL('image/png');
    }

    function compressImageFromSource(dataUrl, fileName) {
      const img = new Image();
      img.onload = function() {
        const aspect = img.height / img.width;
        // ปรับการตัด 3 โซน (หลบเส้นตารางขวาให้แม่นยำ)
        if (aspect > 1.15) { // A4 Full page
          zoneProductDataUrl = cropRegionZoom(img, 0.05, 0.45, 0.40, 0.15, 3.5);
          zoneAmountDataUrl  = cropRegionZoom(img, 0.70, 0.45, 0.26, 0.45, 3.5); // เว้นขอบขวานิดนึง (0.26 จากเดิม 0.3)
          zoneNoteDataUrl    = cropRegionZoom(img, 0.01, 0.85, 0.65, 0.12, 3.0);
        } else { // Cropped Table
          zoneProductDataUrl = cropRegionZoom(img, 0.02, 0.05, 0.45, 0.40, 3.5);
          zoneAmountDataUrl  = cropRegionZoom(img, 0.68, 0.05, 0.28, 0.90, 3.5);
          zoneNoteDataUrl    = cropRegionZoom(img, 0.01, 0.65, 0.70, 0.30, 3.0);
        }

        const MAX_SIDE = 1000;
        let w = img.width, h = img.height;
        if (w > h && w > MAX_SIDE) { h = Math.round(h * (MAX_SIDE / w)); w = MAX_SIDE; }
        else if (h > w && h > MAX_SIDE) { w = Math.round(w * (MAX_SIDE / h)); h = MAX_SIDE; }

        const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        compressedBase64 = canvas.toDataURL('image/jpeg', 0.65);
        compressedFileName = fileName.replace(/\.[^/.]+$/, '') + '.jpg';

        const kb = Math.round((compressedBase64.length * 3 / 4) / 1024);
        document.getElementById('previewImg').src = compressedBase64;
        document.getElementById('previewName').textContent = compressedFileName;
        document.getElementById('previewSize').textContent = 'ขนาด: ~' + kb + ' KB';
        document.getElementById('previewBox').classList.remove('hidden');

        scanReceiptPrice();
      };
      img.src = dataUrl;
    }

    async function scanReceiptPrice() {
      const ocrStatus = document.getElementById('ocrStatusText');
      ocrStatus.classList.remove('hidden'); ocrStatus.classList.add('flex');
      ocrStatus.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles fa-spin"></i> <span>กำลังอ่านบิลอัจฉริยะ...</span>';

      try {
        if (!window.Tesseract) throw new Error('Tesseract unavailable');
        
        // Scan with eng pure for numbers to avoid Thai letter confusion near lines
        const [prodRes, amtRes, noteRes] = await Promise.all([
          zoneProductDataUrl ? Tesseract.recognize(zoneProductDataUrl, 'tha+eng') : Promise.resolve(null),
          zoneAmountDataUrl ? Tesseract.recognize(zoneAmountDataUrl, 'eng') : Promise.resolve(null),
          zoneNoteDataUrl ? Tesseract.recognize(zoneNoteDataUrl, 'tha+eng') : Promise.resolve(null)
        ]);

        const prodText = prodRes?.data?.text || '';
        const amtText = amtRes?.data?.text || '';
        const noteText = noteRes?.data?.text || '';

        const parsed = parseTargetedReceiptZones(prodText, amtText, noteText);

        if (parsed && (parsed.totalAmount > 0 || parsed.fuelType)) {
          if (parsed.fuelType) {
            selectCategory('เชื้อเพลิง');
            const radio = document.querySelector('input[name="fuelType"][value="' + parsed.fuelType + '"]');
            if (radio) { radio.checked = true; updateFuelLabel(parsed.fuelType); }
          }
          if (parsed.detailsText) document.getElementById('details').value = parsed.detailsText;
          
          if (parsed.totalAmount > 0) {
            const priceVal = parsed.totalAmount.toFixed(2);
            if (document.getElementById('singleAmount')) document.getElementById('singleAmount').value = priceVal;
            else if (document.getElementById('runFee')) document.getElementById('runFee').value = priceVal;
            ocrStatus.innerHTML = '<i class="fa-solid fa-circle-check text-[#5F7A61]"></i> <span class="text-[#4E6650]">พบยอด ฿' + Number(priceVal).toLocaleString() + '</span>';
            showNotice('ดึงข้อมูลใบเสร็จสำเร็จ!', false);
            return;
          }
        }
        ocrStatus.innerHTML = '<i class="fa-solid fa-circle-info text-[#8C857B]"></i> <span class="text-[#6E6A63]">สแกนไม่ชัดเจน กรุณากรอกเอง</span>';
      } catch (e) {
        ocrStatus.innerHTML = '<i class="fa-solid fa-circle-info text-[#8C857B]"></i> <span class="text-[#6E6A63]">ไม่พบตัวเลข กรุณากรอกเอง</span>';
      }
    }

    function parseTargetedReceiptZones(prodText, amtText, noteText) {
      const upperProd = (prodText + ' ' + amtText).toUpperCase();
      let fuelType = '', productLabel = '';
      
      if (upperProd.indexOf('95') !== -1 || prodText.indexOf('โซฮอล์') !== -1) { fuelType = 'โซฮอล์ 95'; productLabel = 'PT MAX แก๊สโซฮอล์ 95'; } 
      else if (upperProd.indexOf('LPG') !== -1 || upperProd.indexOf('LP6') !== -1 || upperProd.indexOf('000011') !== -1) { fuelType = 'LPG'; productLabel = 'PT MAX LPG'; } 
      else if (upperProd.indexOf('E20') !== -1) { fuelType = 'E20'; productLabel = 'PT MAX E20'; } 
      else if (upperProd.indexOf('NGV') !== -1) { fuelType = 'NGV'; productLabel = 'PT MAX NGV'; }

      let extractedNote = '';
      if (noteText) {
        const lines = noteText.split(/[\r\n]+/).map(function(l) { return l.trim(); }).filter(Boolean);
        for (let i = 0; i < lines.length; i++) {
          if (/หมายเหตุ\s*2|กรุงเทพ|[ก-ฮ]{1,3}\s*\d{3,4}/.test(lines[i]) && !/Maxcard/i.test(lines[i])) {
            extractedNote = lines[i].replace(/^.*หมายเหตุ\s*2\s*[:：;.\-]?\s*/i, '').replace(/[|_=\[\]]/g, '').trim();
            if (extractedNote.length >= 3) break;
          }
        }
      }

      const detailsParts = [];
      if (productLabel) detailsParts.push(productLabel);
      if (extractedNote) detailsParts.push(extractedNote);
      
      // ลบลูกน้ำหลักพันอย่างระมัดระวัง (เช่น 1,500.00 -> 1500.00) และเคลียร์อักขระแปลกประหลาด
      let cleanedAmt = (amtText || '').replace(/[OQo]/g, '0').replace(/[Il|!]/g, '1');
      cleanedAmt = cleanedAmt.replace(/(\d)\s*,\s*(\d{3})(?!\d)/g, '$1$2'); 
      
      const candidates = [];
      const decRegex = /(\d{2,6})\.(\d{2})(?!\d)/g;
      let match;
      while ((match = decRegex.exec(cleanedAmt)) !== null) {
        const val = parseFloat(match[1] + '.' + match[2]);
        if (val >= 15 && val <= 100000 && Math.floor(val) !== 5278 && Math.floor(val) !== 5279) candidates.push(Number(val.toFixed(2)));
      }

      const uniqueList = [];
      candidates.forEach(function(n) { if (uniqueList.indexOf(n) === -1) uniqueList.push(n); });
      uniqueList.sort(function(a, b) { return b - a; });

      let vatVerifiedTotal = 0;
      for (let i = 0; i < uniqueList.length; i++) {
        for (let j = i + 1; j < uniqueList.length; j++) {
          const a = uniqueList[i], b = uniqueList[j];
          if (Math.abs(a - (b * 1.07)) <= 0.45) { vatVerifiedTotal = a; break; }
          // คำนวณยอดกลับจากยอดก่อนภาษี + ภาษี
          if (Math.abs(b - (a * 0.07)) <= 0.45) { vatVerifiedTotal = Number((a + b).toFixed(2)); break; }
        }
        if (vatVerifiedTotal > 0) break;
      }

      // ตรวจสอบ fallback: บางทียอดก่อนภาษี 1401.87 โผล่ แต่รวมภาษี 1500.00 แหว่งเหลือ 500.00
      if (!vatVerifiedTotal) {
         for(let k=0; k<uniqueList.length; k++){
            const expected = Number((uniqueList[k] * 1.07).toFixed(2));
            for(let m=0; m<uniqueList.length; m++){
               if(expected > uniqueList[k] && Math.abs((expected % 1000) - uniqueList[m]) <= 0.1) {
                  vatVerifiedTotal = expected; break;
               }
            }
            if(vatVerifiedTotal > 0) break;
         }
      }

      return {
        totalAmount: vatVerifiedTotal > 0 ? vatVerifiedTotal : (uniqueList.length > 0 ? uniqueList[0] : 0),
        fuelType: fuelType,
        detailsText: detailsParts.join(' • ')
      };
    }

        item.runFee = parseFloat(document.getElementById('runFee').value || 0);
        item.cashCollected = parseFloat(document.getElementById('cashCollected').value || 0);
        item.tollFee = parseFloat(document.getElementById('tollFee').value || 0);

        item.netExpense = item.runFee + item.tollFee + item.parkingFee + item.tips;
        item.cashIn = item.cashCollected;
      } else if (cat === 'เชื้อเพลิง') {

      } else if (cat === 'คืนเงิน') {
        item.amount = parseFloat(document.getElementById('singleAmount').value || 0);
        item.cashIn = item.amount;
      } else {
        item.amount = parseFloat(document.getElementById('singleAmount').value || 0);
        item.netExpense = item.amount;
      }

      try {
        const response = await fetch(GAS_WEB_APP_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'saveExpense', data: item }) });
        const result = await response.json();

    async function fetchFromSheet() {
      const icon = document.getElementById('refreshIcon'); icon.classList.add('fa-spin');
      try {
        const res = await fetch(GAS_WEB_APP_URL + '?action=getExpenses', { redirect: 'follow' });
        const json = await res.json();
        if (json && json.status === 'success' && Array.isArray(json.data)) {

          renderHistory(); document.getElementById('syncText').textContent = 'ข้อมูลล่าสุดแล้ว';

      } catch (e) {}
      icon.classList.remove('fa-spin');
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      document.getElementById('recordCount').textContent = records.length + ' รายการ';

      let totalExp = 0, totalCash = 0;
      records.forEach(function(r) { totalExp += Number(r.netExpense || 0); totalCash += Number(r.cashIn || 0); });

      document.getElementById('sumExpense').textContent = '฿' + totalExp.toLocaleString('th-TH', { minimumFractionDigits: 2 });
      document.getElementById('sumCashIn').textContent = '฿' + totalCash.toLocaleString('th-TH', { minimumFractionDigits: 2 });

      if (records.length === 0) {
        list.innerHTML = '<p class="text-center text-[#8C857B] text-sm py-10">ยังไม่มีรายการ</p>'; return;
      }

      list.innerHTML = records.map(function(r, idx) {
        const fBadge = r.fuelType ? (' • ' + r.fuelType) : '';
        const locHtml = (r.locationName || r.mapUrl) ? '<div class="mt-1.5"><a href="' + (r.mapUrl || '#') + '" target="_blank" class="inline-flex items-center gap-1.5 text-[10px] text-[#C84B31] bg-[#C84B31]/10 px-2.5 py-1 rounded-md"><i class="fa-solid fa-location-dot"></i> <span class="truncate max-w-[200px]">' + (r.locationName || 'พิกัด GPS') + '</span></a></div>' : '';
        const expHtml = Number(r.netExpense) > 0 ? '<p class="text-sm font-bold text-[#C84B31]">-฿' + Number(r.netExpense).toLocaleString() + '</p>' : '';
        const cashHtml = Number(r.cashIn) > 0 ? '<p class="text-[11px] font-bold text-[#5F7A61]">+฿' + Number(r.cashIn).toLocaleString() + '</p>' : '';
        const sHtml = (r.imageBase64 || r.fileUrl) ? '<button type="button" onclick="openSlipByIndex(' + idx + ')" class="mt-2 inline-flex items-center gap-1.5 text-[10px] font-bold text-[#2B2B2B] bg-[#E5DEC9]/50 hover:bg-[#DCD3C0] px-2.5 py-1 rounded border border-[#DCD3C0] transition"><i class="fa-solid fa-receipt"></i> ดูใบเสร็จ</button>' : '';

        return '<div class="p-4 hover:bg-[#F9F6F0]/50 transition flex items-start justify-between gap-3"><div class="flex-1 min-w-0 space-y-1"><div class="flex items-center gap-2 flex-wrap"><span class="text-[10px] font-bold px-2 py-0.5 rounded bg-[#263547] text-white">' + r.category + fBadge + '</span><span class="text-[10px] text-[#8C857B]">' + (r.date || '') + '</span></div><p class="text-xs font-semibold text-[#2B2B2B] leading-relaxed pr-2">' + (r.details || '-') + '</p>' + locHtml + '</div><div class="text-right shrink-0">' + expHtml + cashHtml + sHtml + '</div></div>';
      }).join('');
    }

    function exportCSV() {
      if (records.length === 0) return showNotice('ยังไม่มีข้อมูล', true);
      const csv = '\uFEFF' + ['วันที่,ประเภท,รายละเอียด,สถานที่,พิกัดแผนที่,รายจ่ายสุทธิ,รายรับ/เงินสด'].concat(records.map(r => [r.date, r.category, '"' + String(r.details || '').replace(/"/g, '""') + '"', '"' + String(r.locationName || '').replace(/"/g, '""') + '"', r.mapUrl || '', r.netExpense || 0, r.cashIn || 0].join(','))).join('\n');
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
      a.download = 'office_expenses_' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
    }
  </script>
</body>
</html>
